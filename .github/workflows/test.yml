name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-free-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          NO_PROXY: "127.0.0.1,localhost"
          no_proxy: "127.0.0.1,localhost"
        run: python -m pytest -q
