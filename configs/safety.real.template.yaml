# M5 real safety template. Placeholder/very conservative values only; on-site
# measurement and leader/operator approval are mandatory.
schema_version: m5-safety/v1

workspace:
  min: [-0.5, -0.5, 0.0]
  max: [0.9, 0.5, 0.8]

tcp_height:
  min_m: 0.02
  max_m: 0.75

motion:
  max_step_translation_m: 0.005
  max_step_rotation_rad: 0.02
  max_linear_velocity_m_s: 0.02
  max_angular_velocity_rad_s: 0.10
  max_linear_acceleration_m_s2: 0.05
  max_angular_acceleration_rad_s2: 0.10
  max_first_target_translation_m: 0.005
  max_first_target_rotation_rad: 0.02
  min_segment_dt_ms: 20.0

staleness:
  max_observation_age_ms: 500
  max_chunk_age_ms: 1000

force:
  max_force_n: 10.0
  max_torque_nm: 2.0

gripper:
  width_min_m: 0.0
  width_max_m: 0.1
  max_speed_m_s: 0.01

action:
  allowed_frames: [base]
  allowed_types: [delta_tcp]

stop_timeout_s: 2.0
preflight_timeout_s: 10.0
enable_timeout_s: 5.0
mode_switch_timeout_s: 5.0
